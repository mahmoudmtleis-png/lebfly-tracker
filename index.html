<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebfly - نظام تتبع الرحلات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a;
            color: #e0e1dd;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1b263b;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #415a77;
        }
        h1 {
            color: #00b4d8;
            font-size: 24px;
            margin-bottom: 25px;
            border-bottom: 2px solid #415a77;
            padding-bottom: 10px;
        }
        .card {
            background-color: #0d1b2a;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            border-right: 5px solid #00b4d8;
            text-align: right;
        }
        .label {
            font-size: 14px;
            color: #8d99ae;
            margin-bottom: 5px;
        }
        .value {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }
        .loading {
            color: #90e0ef;
            font-style: italic;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDf2-Z5FJ7hRMnSPQmujRSXwTpTqhq7X8I",
            authDomain: "my-fly-lbsd.firebaseapp.com",
            projectId: "my-fly-lbsd",
            storageBucket: "my-fly-lbsd.appspot.com",
            messagingSenderId: "414684013919",
            appId: "1:414684013919:web:cb74b67e0a5964c8ed82ea",
            measurementId: "G-LB8RLT7KP2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function getShipmentData() {
            try {
                const docRef = doc(db, "Shipments", "Lebfly-2026");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const statusValue = data.Status || data.status || "غير محدد";
                    const locationValue = data.Location || data.location || "غير محدد";

                    document.getElementById("status").innerText = statusValue;
                    document.getElementById("location").innerText = locationValue;
                } else {
                    document.getElementById("status").innerText = "لم يتم العثور على الرحلة";
                }
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                document.getElementById("status").innerText = "خطأ في الاتصال";
            }
        }
        window.onload = getShipmentData;
    </script>
</head>
<body>

    <div class="container">
        <h1>✈️ Lebfly - تتبع الرحلة</h1>
        
        <div class="card">
            <div class="label">حالة الرحلة</div>
            <div id="status" class="value loading">جاري التحميل...</div>
        </div>
 <div class="card"> <div class="label">الوقت</div> <div id="time" class="value loading">جاري التحميل...</div> </div>

            <div class="label">الموقع الحالي</div>
            <div id="location" class="value loading">جاري التحديد...</div>
        </div>
    </div>

</body>
</html>
